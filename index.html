<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>/* Áp sáng/tối đã chọn ngay khi mở, tránh nháy màu */
try { var t = localStorage.getItem('qat:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span class="logo" aria-hidden="true">QA</span><h1 data-t="title"></h1></div>
  <nav class="views" role="tablist" aria-label="Chế độ xem">
    <button type="button" role="tab" data-g="view" data-v="board" data-t="v_board"></button>
    <button type="button" role="tab" data-g="view" data-v="list" data-t="v_list"></button>
    <button type="button" role="tab" data-g="view" data-v="dash" data-t="v_dash"></button>
  </nav>
  <div class="tools">
    <div class="lang" role="group" aria-label="Ngôn ngữ / 언어">
      <button type="button" data-g="lang" data-v="bi">VI + 한</button><button type="button" data-g="lang" data-v="vi">VI</button><button type="button" data-g="lang" data-v="ko">한</button>
    </div>
    <button class="themeb" id="btheme" type="button" data-g="theme">◐</button>
  </div>
</div></header>

<main class="wrap">
  <!-- Thanh công cụ: tạo issue, tìm, lọc -->
  <div class="toolbar">
    <button class="pri" type="button" data-g="create" data-t="create" title="Phím tắt: C"></button>
    <input id="q" type="search" aria-label="Tìm">
    <div class="filters">
      <select id="f_type" aria-label="Loại issue"></select>
      <select id="f_mk" aria-label="Thị trường"></select>
      <select id="f_pri" aria-label="Ưu tiên"></select>
      <select id="f_cat" aria-label="Loại lỗi"></select>
      <select id="f_as" aria-label="Người xử lý"></select>
    </div>
  </div>
  <div class="quick" id="quick"></div>

  <section id="view"></section>

  <details class="box">
    <summary data-t="backup"></summary>
    <div class="g2 settings">
      <label><span data-t="projkey"></span><input id="s_key" maxlength="8"></label>
      <label><span data-t="me"></span><input id="s_me" maxlength="30"></label>
    </div>
    <p class="mut" data-t="backuph"></p>
    <div class="acts">
      <button class="ghost" type="button" data-g="export" data-t="export"></button>
      <label class="ghost file"><span data-t="import"></span><input type="file" id="impf" accept=".json,application/json" hidden></label>
      <button class="ghost" type="button" data-g="csv" data-t="csv"></button>
      <span class="msg" id="bmsg" role="status"></span>
    </div>
  </details>
  <p class="foot" id="sync" role="status"></p>
</main>

<!-- Trang chi tiết issue (mở bên phải) -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dtitle"></aside>

<div id="toast" class="toast" role="status" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
